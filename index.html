<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradinGo | شارتات البورصة المصرية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#2f81f7"/><path d="M6 8v8M6 10h0M12 5v12M18 9v9" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="4.5" y="9" width="3" height="5" fill="#26a69a"/><rect x="10.5" y="7" width="3" height="7" fill="#ef5350"/><rect x="16.5" y="11" width="3" height="5" fill="#26a69a"/></svg><span class="bn">Tradin<span>Go</span></span></div>
  <div class="sym-box">
    <input id="symInput" list="symList" autocomplete="off" spellcheck="false" data-i18n-ph="search">
    <datalist id="symList"></datalist>
  </div>
  <div id="symName" class="sym-name"></div>
  <div class="group" id="tfGroup"></div>
  <div class="group" id="typeGroup"></div>
  <select id="rangeSel" title="range"></select>
  <label class="chk"><input type="checkbox" id="logScale"><span data-i18n="log"></span></label>
  <div class="spacer"></div>
  <div id="dataNote" class="note"></div>
  <button id="langBtn" class="btn">EN</button>
  <button id="aboutBtn" class="btn" title="About / Licences" aria-label="About">ⓘ</button>
  <button id="panelBtn" class="btn primary">☰</button>
</header>
<main>
  <aside id="tools"></aside>
  <section id="chartCol">
    <div id="legend" dir="ltr"></div>
    <div id="chartWrap" dir="ltr">
      <div id="chart"></div>
      <canvas id="overlay"></canvas>
      <div id="textPrompt" hidden></div>
    </div>
  </section>
  <aside id="panel">
    <nav id="tabs">
      <button data-tab="ind" class="on" data-i18n="indicators"></button>
      <button data-tab="script" data-i18n="script"></button>
      <button data-tab="stats" data-i18n="stats"></button>
      <button data-tab="draw" data-i18n="drawings"></button>
      <button data-tab="scr" data-i18n="screener"></button>
      <button data-tab="alerts" data-i18n="alerts"></button>
    </nav>
    <div class="tab" id="tab-ind">
      <div class="row"><select id="indSel"></select><button class="btn" id="indAdd" data-i18n="add"></button></div>
      <div id="indList"></div>
      <h4 data-i18n="compare"></h4>
      <div class="row"><input id="cmpInput" list="symList" data-i18n-ph="cmpPh"><button class="btn" id="cmpBtn" data-i18n="apply"></button><button class="btn" id="cmpClr">×</button></div>
      <div class="hint" data-i18n="cmpHint"></div>
    </div>
    <div class="tab" id="tab-script" hidden>
      <div class="row">
        <select id="exSel"></select>
        <button class="btn" id="exLoad" data-i18n="load"></button>
      </div>
      <textarea id="code" dir="ltr" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn primary" id="runBtn">▶ <span data-i18n="run"></span></button>
        <button class="btn" id="saveBtn" data-i18n="save"></button>
        <button class="btn" id="clrScript" data-i18n="clearOut"></button>
        <label class="chk"><input type="checkbox" id="autoRun" checked><span data-i18n="autorun"></span></label>
      </div>
      <div class="row"><button class="btn" id="expScripts"></button><button class="btn" id="impScripts"></button><input type="file" id="impFile" accept=".json,application/json" hidden></div>
      <div class="row"><select id="savedSel"></select><button class="btn" id="savedLoad" data-i18n="load"></button><button class="btn" id="savedDel">×</button></div>
      <pre id="out" dir="ltr"></pre>
      <details><summary data-i18n="apiTitle"></summary><pre id="apiDoc" dir="ltr"></pre></details>
    </div>
    <div class="tab" id="tab-stats" hidden><div id="statsBox"></div></div>
    <div class="tab" id="tab-draw" hidden>
      <div id="drawList"></div>
      <div class="row"><button class="btn" id="undoDraw" data-i18n="undo"></button><button class="btn" id="clearDraw" data-i18n="clearAll"></button></div>
      <div class="hint" data-i18n="drawHint"></div>
    </div>
    <div class="tab" id="tab-scr" hidden>
      <div class="row"><button class="btn primary" id="scrRun" data-i18n="scan"></button><span id="scrProg" class="hint"></span></div>
      <div id="scrBox"></div>
    </div>
    <div class="tab" id="tab-alerts" hidden>
      <div class="row"><select id="alKind"></select><input id="alVal" type="number" step="any" inputmode="decimal" style="width:90px"></div>
      <div class="row"><button class="btn primary" id="alAdd"></button><button class="btn" id="alPerm"></button><label class="chk"><input type="checkbox" id="alSound" checked><span id="alSoundLbl"></span></label></div>
      <div id="alList"></div>
      <div class="hint" id="alHint"></div>
    </div>
  </aside>
</main>
<footer id="about">TradinGo</footer>
<script src="vendor/lightweight-charts.js"></script>
<script src="ta.js"></script>
<script src="data/symbols.js"></script>
<script src="data/intra.js"></script>
<script src="app.js"></script>
</body>
</html>
